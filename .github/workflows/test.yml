name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/competitor-screenshot-insights/requirements-eval.txt
      - name: Install validation dependencies
        run: python -m pip install -r skills/competitor-screenshot-insights/requirements-eval.txt
      - name: Run deterministic Skill tests
        env:
          CSI_EVAL_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: sh skills/competitor-screenshot-insights/scripts/run-tests.sh
      - name: Validate self-contained report Skill
        run: python skills/build-competitor-report-html/scripts/validate_package.py
      - name: Test GitHub archive installation mode
        env:
          CSI_EVAL_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          archive_root=$(mktemp -d)
          cp -R skills/competitor-screenshot-insights "$archive_root/competitor-screenshot-insights"
          find "$archive_root/competitor-screenshot-insights/scripts" -type f -exec chmod a-x {} +
          sh "$archive_root/competitor-screenshot-insights/scripts/run-tests.sh"
      - name: Check release hygiene
        run: sh scripts/release-check.sh
